<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <script>(function(){try{var t=localStorage.getItem('koda-theme')||(window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <title>{% block title %}Family Koda Control{% endblock %} | KODA</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/app.css') }}">
  <script src="{{ url_for('static', path='/htmx.min.js') }}" defer></script>
  <script src="{{ url_for('static', path='/lucide.min.js') }}" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => lucide.createIcons());
    document.addEventListener("htmx:afterSwap", () => lucide.createIcons());
  </script>
</head>
<body hx-boost="true" hx-indicator="#page-loader">
  <div id="page-loader" class="page-loader htmx-indicator" aria-hidden="true"></div>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="brand" href="/" aria-label="Family Koda Control dashboard">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/></svg>
        </span>
        <span>Family Koda Control</span>
        <span class="brand-version">v2.0</span>
      </a>
      <nav class="desktop-nav" aria-label="Main navigation">
        <a href="/" class="nav-link {% if page == 'dashboard' %}active{% endif %}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
          Dashboard
        </a>
        <a href="/expenses" class="nav-link {% if page == 'expenses' %}active{% endif %}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
          Expenses
        </a>
        <a href="/budgets" class="nav-link {% if page == 'budgets' %}active{% endif %}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7V4a1 1 0 0 0-1-1H5a3 3 0 0 0 0 6h16v11a1 1 0 0 1-1 1H5a3 3 0 0 1-3-3V6"/><path d="M16 13h2"/></svg>
          Budgets
        </a>
      </nav>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">
        <svg class="theme-icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M6.3 17.7l-1.4 1.4M19.1 4.9l-1.4 1.4"/></svg>
        <svg class="theme-icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <a href="/expenses" class="primary-button header-action">
        <i data-lucide="plus" aria-hidden="true"></i>
        <span>Add expense</span>
      </a>
    </div>
  </header>

  <main class="shell main-content">
    {% block content %}{% endblock %}
  </main>

  <nav class="mobile-nav" aria-label="Mobile navigation">
    <a href="/" class="mobile-nav-link {% if page == 'dashboard' %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
      Dashboard
    </a>
    <a href="/expenses" class="mobile-nav-link {% if page == 'expenses' %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      Expenses
    </a>
    <a href="/budgets" class="mobile-nav-link {% if page == 'budgets' %}active{% endif %}">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7V4a1 1 0 0 0-1-1H5a3 3 0 0 0 0 6h16v11a1 1 0 0 1-1 1H5a3 3 0 0 1-3-3V6"/><path d="M16 13h2"/></svg>
      Budgets
    </a>
  </nav>
  <script>
    if (!window.__kodaThemeBound) {
      window.__kodaThemeBound = true;
      document.addEventListener("click", function (event) {
        if (!event.target.closest("#theme-toggle")) return;
        var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
        document.documentElement.dataset.theme = next;
        try { localStorage.setItem("koda-theme", next); } catch (e) {}
      });
    }
  </script>
</body>
</html>
